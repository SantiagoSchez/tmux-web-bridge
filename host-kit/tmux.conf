# tmux-web-bridge · host-kit: lo que necesita el panel web en esta máquina.
# install.sh añade a ~/.tmux.conf, en un bloque marcado:  source-file -q <clon>/host-kit/tmux.conf
# Los scripts del kit se llaman en el clon (por @twb_kit_dir): nada se enlaza fuera de él.
# Se actualiza desde el panel, o con git checkout de la release (y se recarga); lo tuyo, en ~/.tmux.conf.

# ------------------------------------------------------------ versión del kit
# El panel compara la versión con la última release para avisar de las máquinas sin
# actualizar (VERSION en la raíz del clon), y usa la ruta del clon para actualizarlo.
run-shell "tmux set -g @twb_kit_version \"$(cat '#{d:current_file}/../VERSION' 2>/dev/null)\"; tmux set -g @twb_kit_dir \"$(cd '#{d:current_file}/..' && pwd)\""

# ------------------------------------------------------------ terminal del panel
# El scroll con el dedo llega como rueda del ratón: tmux entra en modo copia, o se
# la pasa a un programa a pantalla completa (Claude Code con tui fullscreen).
set -g mouse on
# Lo que copias en tmux llega al portapapeles del dispositivo desde el que miras (OSC 52).
set -g set-clipboard on
# Los enlaces OSC 8 (los de Claude Code) llegan al panel, que se conecta como
# xterm-256color; sin esto tmux los quita. Índice fijo: recargar no lo duplica.
set -s terminal-features[99] xterm-256color:hyperlinks

# ------------------------------------------------------------ estados de Claude Code
# 🙋 💬 ✅ 🔨 🤖 en paneles, ventanas y espacios. Ver host-kit/tmux-window-title.sh.
# pane-focus-in necesita los eventos de foco del terminal.
set -g focus-events on
# El foco convierte ✅ (terminado sin ver) en 🤖; cerrar paneles/ventanas recalcula iconos.
set-hook -g pane-focus-in 'run-shell -b "#{q:@twb_kit_dir}/host-kit/tmux-window-title.sh focus #{pane_id}"'
set-hook -g pane-exited 'run-shell -b "#{q:@twb_kit_dir}/host-kit/tmux-window-title.sh refresh-all"'
set-hook -g after-kill-pane 'run-shell -b "#{q:@twb_kit_dir}/host-kit/tmux-window-title.sh refresh-all"'
set-hook -g window-unlinked 'run-shell -b "#{q:@twb_kit_dir}/host-kit/tmux-window-title.sh refresh-all"'

# ------------------------------------------------------------ espacios
# Cada sesión es un espacio, numerado por orden de creación (@space_num): el panel
# los lista con ese número y Ctrl+Shift+1…9 salta a ellos. Ver host-kit/tmux-spaces.sh.
set-hook -g session-created 'run-shell -b "#{q:@twb_kit_dir}/host-kit/tmux-spaces.sh renumber"'
set-hook -g session-closed 'run-shell -b "#{q:@twb_kit_dir}/host-kit/tmux-spaces.sh renumber"'
run-shell -b "#{q:@twb_kit_dir}/host-kit/tmux-spaces.sh renumber; #{q:@twb_kit_dir}/host-kit/tmux-window-title.sh refresh-all"

# prefix + Shift+←/→: espacio anterior / siguiente.
bind -r S-Left run-shell "#{q:@twb_kit_dir}/host-kit/tmux-spaces.sh prev '#{client_name}'"
bind -r S-Right run-shell "#{q:@twb_kit_dir}/host-kit/tmux-spaces.sh next '#{client_name}'"
# prefix + Shift+1…9 → espacio N. tmux recibe el carácter con Shift, así que sigue la
# distribución española ISO (! " · $ % & / ( )) y sustituye los atajos de tmux en esas teclas.
bind '!' run-shell "#{q:@twb_kit_dir}/host-kit/tmux-spaces.sh goto '#{client_name}' 1"
bind \" run-shell "#{q:@twb_kit_dir}/host-kit/tmux-spaces.sh goto '#{client_name}' 2"
bind '·' run-shell "#{q:@twb_kit_dir}/host-kit/tmux-spaces.sh goto '#{client_name}' 3"
bind '$' run-shell "#{q:@twb_kit_dir}/host-kit/tmux-spaces.sh goto '#{client_name}' 4"
bind '%' run-shell "#{q:@twb_kit_dir}/host-kit/tmux-spaces.sh goto '#{client_name}' 5"
bind '&' run-shell "#{q:@twb_kit_dir}/host-kit/tmux-spaces.sh goto '#{client_name}' 6"
bind '/' run-shell "#{q:@twb_kit_dir}/host-kit/tmux-spaces.sh goto '#{client_name}' 7"
bind '(' run-shell "#{q:@twb_kit_dir}/host-kit/tmux-spaces.sh goto '#{client_name}' 8"
bind ')' run-shell "#{q:@twb_kit_dir}/host-kit/tmux-spaces.sh goto '#{client_name}' 9"
# prefix + g: al agente más urgente (🙋 > 💬 > ✅); repetido, recorre el resto.
bind g run-shell "#{q:@twb_kit_dir}/host-kit/tmux-spaces.sh pending '#{client_name}' '#{pane_id}'"
# prefix + N / R / X: nuevo espacio, renombrarlo, cerrarlo (X avisa si tiene algún Claude abierto).
bind N command-prompt -p "Nombre del nuevo espacio (vacío = automático):" "run-shell \"#{q:@twb_kit_dir}/host-kit/tmux-spaces.sh new '#{client_name}' '#{pane_current_path}' '%%'\""
bind R command-prompt -I "#S" -p "Nombre del espacio:" "rename-session -- '%%'"
bind X run-shell "#{q:@twb_kit_dir}/host-kit/tmux-window-title.sh close session '#{session_id}' '#{client_name}'"

# ------------------------------------------------------------ cerrar con Claude abierto
# Cerrar un panel, una ventana o un espacio con un Claude dentro pregunta antes en un popup,
# con el id de cada conversación, y al cerrar copia «cd … && claude --resume <id>» al
# portapapeles (y al buffer de tmux) para reanudarla luego. Sin Claude cierra sin más.
# prefix + x: cerrar el panel. El resto de atajos que cierran a pelo (un Ctrl+W tuyo con
# kill-pane, los «Kill» de los menús del clic derecho) se reescriben para pasar por aquí.
bind x run-shell "#{q:@twb_kit_dir}/host-kit/tmux-window-title.sh close pane '#{pane_id}' '#{client_name}'"
run-shell "#{q:@twb_kit_dir}/host-kit/tmux-window-title.sh wrap-kill-keys"

# Ctrl+Shift+1…9 y Ctrl+Shift+N sin prefijo: Ghostty los manda como secuencias propias
# (keybind = ctrl+shift+digit_1=text:\x1b[5;30001~ … y ctrl+shift+key_n=text:\x1b[5;30010~).
set -s user-keys[0] "\e[5;30001~"
set -s user-keys[1] "\e[5;30002~"
set -s user-keys[2] "\e[5;30003~"
set -s user-keys[3] "\e[5;30004~"
set -s user-keys[4] "\e[5;30005~"
set -s user-keys[5] "\e[5;30006~"
set -s user-keys[6] "\e[5;30007~"
set -s user-keys[7] "\e[5;30008~"
set -s user-keys[8] "\e[5;30009~"
set -s user-keys[9] "\e[5;30010~"
bind -n User0 run-shell "#{q:@twb_kit_dir}/host-kit/tmux-spaces.sh goto '#{client_name}' 1"
bind -n User1 run-shell "#{q:@twb_kit_dir}/host-kit/tmux-spaces.sh goto '#{client_name}' 2"
bind -n User2 run-shell "#{q:@twb_kit_dir}/host-kit/tmux-spaces.sh goto '#{client_name}' 3"
bind -n User3 run-shell "#{q:@twb_kit_dir}/host-kit/tmux-spaces.sh goto '#{client_name}' 4"
bind -n User4 run-shell "#{q:@twb_kit_dir}/host-kit/tmux-spaces.sh goto '#{client_name}' 5"
bind -n User5 run-shell "#{q:@twb_kit_dir}/host-kit/tmux-spaces.sh goto '#{client_name}' 6"
bind -n User6 run-shell "#{q:@twb_kit_dir}/host-kit/tmux-spaces.sh goto '#{client_name}' 7"
bind -n User7 run-shell "#{q:@twb_kit_dir}/host-kit/tmux-spaces.sh goto '#{client_name}' 8"
bind -n User8 run-shell "#{q:@twb_kit_dir}/host-kit/tmux-spaces.sh goto '#{client_name}' 9"
bind -n User9 run-shell "#{q:@twb_kit_dir}/host-kit/tmux-spaces.sh new '#{client_name}' '#{pane_current_path}'"

# Opcional: mostrar el icono en la barra de estado (si tu tema no lo hace ya).
# setw -g window-status-format '#I #{?@win_icon,#{@win_icon} ,}#W'
# setw -g window-status-current-format '#I #{?@win_icon,#{@win_icon} ,}#W'
