# tmux-web-bridge · host-kit: lo que necesita el panel web en esta máquina.
# install.sh añade a ~/.tmux.conf:  source-file <clon>/host-kit/tmux.conf
# git pull lo pone al día (y lo recarga); lo tuyo, en ~/.tmux.conf.

# ------------------------------------------------------------ terminal del panel
# El scroll con el dedo llega como rueda del ratón: tmux entra en modo copia, o se
# la pasa a un programa a pantalla completa (Claude Code con tui fullscreen).
set -g mouse on
# Lo que copias en tmux llega al portapapeles del dispositivo desde el que miras (OSC 52).
set -g set-clipboard on
# Los enlaces OSC 8 (los de Claude Code) llegan al panel, que se conecta como
# xterm-256color; sin esto tmux los quita. Índice fijo: recargar no lo duplica.
set -s terminal-features[99] xterm-256color:hyperlinks

# ------------------------------------------------------------ estados de Claude Code
# 🙋 💬 ✅ 🔨 🤖 en paneles, ventanas y spaces. Ver ~/.scripts/tmux-window-title.sh.
# pane-focus-in necesita los eventos de foco del terminal.
set -g focus-events on
# El foco convierte ✅ (terminado sin ver) en 🤖; cerrar paneles/ventanas recalcula iconos.
set-hook -g pane-focus-in 'run-shell -b "~/.scripts/tmux-window-title.sh focus #{pane_id}"'
set-hook -g pane-exited 'run-shell -b "~/.scripts/tmux-window-title.sh refresh-all"'
set-hook -g after-kill-pane 'run-shell -b "~/.scripts/tmux-window-title.sh refresh-all"'
set-hook -g window-unlinked 'run-shell -b "~/.scripts/tmux-window-title.sh refresh-all"'

# ------------------------------------------------------------ spaces
# Cada sesión es un space, numerado por orden de creación (@space_num): el panel
# los lista con ese número y Ctrl+Shift+1…9 salta a ellos. Ver ~/.scripts/tmux-spaces.sh.
set-hook -g session-created 'run-shell -b "~/.scripts/tmux-spaces.sh renumber"'
set-hook -g session-closed 'run-shell -b "~/.scripts/tmux-spaces.sh renumber"'
run-shell -b "~/.scripts/tmux-spaces.sh renumber; ~/.scripts/tmux-window-title.sh refresh-all"

# prefix + Shift+←/→: space anterior / siguiente.
bind -r S-Left run-shell "~/.scripts/tmux-spaces.sh prev '#{client_name}'"
bind -r S-Right run-shell "~/.scripts/tmux-spaces.sh next '#{client_name}'"
# prefix + Shift+1…9 → space N. tmux recibe el carácter con Shift, así que sigue la
# distribución española ISO (! " · $ % & / ( )) y sustituye los atajos de tmux en esas teclas.
bind '!' run-shell "~/.scripts/tmux-spaces.sh goto '#{client_name}' 1"
bind \" run-shell "~/.scripts/tmux-spaces.sh goto '#{client_name}' 2"
bind '·' run-shell "~/.scripts/tmux-spaces.sh goto '#{client_name}' 3"
bind '$' run-shell "~/.scripts/tmux-spaces.sh goto '#{client_name}' 4"
bind '%' run-shell "~/.scripts/tmux-spaces.sh goto '#{client_name}' 5"
bind '&' run-shell "~/.scripts/tmux-spaces.sh goto '#{client_name}' 6"
bind '/' run-shell "~/.scripts/tmux-spaces.sh goto '#{client_name}' 7"
bind '(' run-shell "~/.scripts/tmux-spaces.sh goto '#{client_name}' 8"
bind ')' run-shell "~/.scripts/tmux-spaces.sh goto '#{client_name}' 9"
# prefix + g: al agente más urgente (🙋 > 💬 > ✅); repetido, recorre el resto.
bind g run-shell "~/.scripts/tmux-spaces.sh pending '#{client_name}' '#{pane_id}'"
# prefix + N / R / X: nuevo space, renombrarlo, cerrarlo.
bind N command-prompt -p "Nombre del nuevo space (vacío = automático):" "run-shell \"~/.scripts/tmux-spaces.sh new '#{client_name}' '#{pane_current_path}' '%%'\""
bind R command-prompt -I "#S" -p "Nombre del space:" "rename-session -- '%%'"
bind X confirm-before -p "¿Cerrar el space #S? (y/n)" kill-session

# Ctrl+Shift+1…9 y Ctrl+Shift+N sin prefijo: Ghostty los manda como secuencias propias
# (keybind = ctrl+shift+digit_1=text:\x1b[5;30001~ … y ctrl+shift+key_n=text:\x1b[5;30010~).
set -s user-keys[0] "\e[5;30001~"
set -s user-keys[1] "\e[5;30002~"
set -s user-keys[2] "\e[5;30003~"
set -s user-keys[3] "\e[5;30004~"
set -s user-keys[4] "\e[5;30005~"
set -s user-keys[5] "\e[5;30006~"
set -s user-keys[6] "\e[5;30007~"
set -s user-keys[7] "\e[5;30008~"
set -s user-keys[8] "\e[5;30009~"
set -s user-keys[9] "\e[5;30010~"
bind -n User0 run-shell "~/.scripts/tmux-spaces.sh goto '#{client_name}' 1"
bind -n User1 run-shell "~/.scripts/tmux-spaces.sh goto '#{client_name}' 2"
bind -n User2 run-shell "~/.scripts/tmux-spaces.sh goto '#{client_name}' 3"
bind -n User3 run-shell "~/.scripts/tmux-spaces.sh goto '#{client_name}' 4"
bind -n User4 run-shell "~/.scripts/tmux-spaces.sh goto '#{client_name}' 5"
bind -n User5 run-shell "~/.scripts/tmux-spaces.sh goto '#{client_name}' 6"
bind -n User6 run-shell "~/.scripts/tmux-spaces.sh goto '#{client_name}' 7"
bind -n User7 run-shell "~/.scripts/tmux-spaces.sh goto '#{client_name}' 8"
bind -n User8 run-shell "~/.scripts/tmux-spaces.sh goto '#{client_name}' 9"
bind -n User9 run-shell "~/.scripts/tmux-spaces.sh new '#{client_name}' '#{pane_current_path}'"

# Opcional: mostrar el icono en la barra de estado (si tu tema no lo hace ya).
# setw -g window-status-format '#I #{?@win_icon,#{@win_icon} ,}#W'
# setw -g window-status-current-format '#I #{?@win_icon,#{@win_icon} ,}#W'
