# Adjunta la extensión de Trello, construida y en un .zip, a cada release de GitHub. A mano
# (workflow_dispatch), a una release que ya existe: por ejemplo, si este workflow falló.
name: trello-extension

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release a la que adjuntarla (vX.Y.Z)
        required: true

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter trello-extension
      - run: pnpm --filter trello-extension typecheck
      - run: pnpm --filter trello-extension test
      - run: pnpm --filter trello-extension package
      - run: gh release upload "$TAG" trello-extension/twb-trello-extension-*.zip --clobber
