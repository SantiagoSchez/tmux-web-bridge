# Publishes the GitHub release of each tag, with the Trello extension built and zipped. On a
# tag push it creates the release as a draft (unless it exists) with the version's section of
# CHANGELOG.md, attaches the .zip and only then publishes it: the kits that update when they see
# the new release already find it. By hand (workflow_dispatch), on a tag already pushed: for
# instance, after this workflow failed.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag de la release (vX.Y.Z)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Two runs of one tag would each create their own draft.
    concurrency:
      group: release-${{ inputs.tag || github.ref_name }}
      cancel-in-progress: false
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter trello-extension
      - run: pnpm --filter trello-extension typecheck
      - run: pnpm --filter trello-extension test
      - run: pnpm --filter trello-extension build
      # Zipped here and not with the package script, so any tag works (even one older than it).
      - run: cd trello-extension/dist && zip -qr "$RUNNER_TEMP/twb-trello-extension-$TAG.zip" .
      - name: Crea la release en borrador si aún no existe
        run: |
          # Only "release not found" means it is missing: any other failure of gh stops here.
          if out=$(gh release view "$TAG" 2>&1); then exit 0; fi
          if ! grep -q 'release not found' <<<"$out"; then
            echo "$out"
            exit 1
          fi
          # The tag's own section of CHANGELOG.md, without its "## X.Y.Z - date" heading.
          awk -v v="${TAG#v}" '
            index($0, "## " v " ") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md | sed '/./,$!d' > "$RUNNER_TEMP/notes.md"
          if ! grep -q . "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md no tiene sección para ${TAG#v}"
            exit 1
          fi
          gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
      - run: gh release upload "$TAG" "$RUNNER_TEMP/twb-trello-extension-$TAG.zip" --clobber
      # Only a draft: editing a published release could mark an older one as the latest again.
      # It is the latest only when no published release has a higher version: the hub takes the
      # latest release as the version to update to.
      - name: Publica la release, ya con el .zip
        run: |
          draft=$(gh release view "$TAG" --json isDraft -q .isDraft)
          if [ "$draft" != true ]; then exit 0; fi
          published=$(gh release list --exclude-drafts --limit 1000 --json tagName -q '.[].tagName')
          highest=$(printf '%s\n%s\n' "$published" "$TAG" | grep -v '^$' | sort -V | tail -n 1)
          latest=false
          if [ "$highest" = "$TAG" ]; then latest=true; fi
          gh release edit "$TAG" --draft=false --latest="$latest"
