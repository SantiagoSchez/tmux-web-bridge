<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trello → twb: opciones</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1>Trello → twb</h1>
      <p class="lead">Un botón en cada tarjeta de Trello que lanza un Claude con ella en tmux-web-bridge y la mueve a Doing.</p>
      <p id="update" class="update" hidden>
        <span id="update-text"></span>
        <button id="update-open" type="button">Abrir chrome://extensions</button>
      </p>

      <form id="form" novalidate>
        <fieldset>
          <legend>tmux-web-bridge</legend>
          <label class="field">
            <span>Dirección del panel</span>
            <input id="hubUrl" type="url" placeholder="https://twb.example.com" autocomplete="off" required />
          </label>
          <label class="field">
            <span>Token de la extensión</span>
            <input id="hubToken" type="password" placeholder="twbx_…" autocomplete="off" spellcheck="false" required />
            <small>Se genera en el panel, en ⚙️ Ajustes › Trello.</small>
          </label>
        </fieldset>

        <p class="note">La cuenta de Trello (para mover la tarjeta a Doing y comentar) y la plantilla del prompt se configuran en el panel, en ⚙️ Ajustes › Trello.</p>

        <div class="actions">
          <button type="submit" class="primary">Guardar y probar</button>
        </div>
        <ul id="status" class="status" aria-live="polite"></ul>
      </form>
    </main>
    <script src="options.js"></script>
  </body>
</html>
